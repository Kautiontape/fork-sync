name: smoke-test
on: workflow_dispatch
concurrency:
  { group: 'fork-sync-${{ github.repository }}', cancel-in-progress: false }
jobs:
  smoke:
    permissions: { contents: write, pull-requests: write }
    uses: ./.github/workflows/fork-sync.yml
    with:
      upstream: actualbudget/actual
      mode: notify
      tag_pattern: '^v26\.'
    secrets: inherit
