name: fork-sync
on:
  workflow_call:
    inputs:
      upstream: { required: true, type: string } # owner/repo
      mode: { required: true, type: string } # rebase | merge | notify
      tag_pattern: { required: true, type: string } # grep -E pattern for release tags
      base_marker: { required: false, type: string, default: '.ktn-base' }
      deploy_branch: { required: false, type: string, default: 'ktn' }
      dry_run: { required: false, type: boolean, default: false }
    secrets:
      NTFY_URL: { required: true }
      SYNC_PR_TOKEN: { required: false } # optional PAT: Contents+Pull requests+Workflows write

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      new_tag: ${{ steps.d.outputs.new_tag }}
      current: ${{ steps.d.outputs.current }}
      has_new: ${{ steps.d.outputs.has_new }}
    steps:
      - uses: actions/checkout@v4
        if: inputs.mode != 'notify'
        with: { ref: '${{ inputs.deploy_branch }}' }
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ inputs.upstream }}
          TAG_PATTERN: ${{ inputs.tag_pattern }}
          MODE: ${{ inputs.mode }}
          BASE_MARKER: ${{ inputs.base_marker }}
        run: |
          set -eo pipefail
          # Staged so a real ls-remote/network failure (pipefail, aborts here)
          # stays distinguishable from "fetched fine, nothing matched the
          # pattern" (grep exit 1 is absorbed by `|| true`, not fatal).
          tags=$(git ls-remote --tags --refs "https://github.com/$UPSTREAM.git" | awk -F/ '{print $NF}')
          matched=$(printf '%s\n' "$tags" | { grep -E -e "$TAG_PATTERN" || true; })
          latest=$(printf '%s\n' "$matched" | sort -V | tail -1)

          # Defense-in-depth: upstream tag names are hostile input. Reject
          # anything empty or containing characters that aren't safe to use
          # as a git ref / branch-name component / shell token downstream.
          case "$latest" in
            '') echo "no upstream tag matched pattern: $TAG_PATTERN (misconfigured tag_pattern, or upstream has no matching releases)" >&2; exit 1 ;;
            -*) echo "unsafe tag name (leading dash): $latest" >&2; exit 1 ;;
            *[!A-Za-z0-9._-]*) echo "unsafe tag name (unexpected characters): $latest" >&2; exit 1 ;;
          esac

          if [ "$MODE" = "notify" ]; then
            # `gh api` still writes the JSON error body to stdout on a 404
            # even with --jq, so check its own exit status first - piping
            # that error body into base64 -d unguarded corrupts this output.
            if body=$(gh api "repos/$GITHUB_REPOSITORY/contents/LAST_TAG?ref=fork-sync-state" 2>/dev/null); then
              current=$(printf '%s' "$body" | jq -r .content | base64 -d)
            else
              current=""
            fi
          else
            current=$(cat "$BASE_MARKER")
          fi
          current=$(printf '%s' "$current" | head -n1)

          echo "new_tag=$latest"  >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ -n "$latest" ] && [ "$latest" != "$current" ]; then
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi

  attempt:
    needs: detect
    if: needs.detect.outputs.has_new == 'true' && inputs.mode != 'notify'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      outcome: ${{ steps.sync.outputs.outcome }}
      detail: ${{ steps.sync.outputs.detail }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.deploy_branch }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_PR_TOKEN || github.token }}
      - id: sync
        env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || github.token }}
          HAS_PR_TOKEN: ${{ secrets.SYNC_PR_TOKEN != '' }}
          NEW: ${{ needs.detect.outputs.new_tag }}
          CUR: ${{ needs.detect.outputs.current }}
          MODE: ${{ inputs.mode }}
          UPSTREAM: ${{ inputs.upstream }}
          BASE_MARKER: ${{ inputs.base_marker }}
          DEPLOY_BRANCH: ${{ inputs.deploy_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -e
          git config user.name ktn-bot
          git config user.email ktn-bot@users.noreply.github.com
          git remote add upstream "https://github.com/$UPSTREAM.git"
          # Fetch only the two tags we need. NEW must exist; tolerate CUR
          # having been deleted upstream (merge mode doesn't need it, and a
          # missing CUR shouldn't kill the run before we even try to sync).
          git fetch --no-tags --quiet upstream tag "$NEW"
          git fetch --no-tags --quiet upstream tag "$CUR" || true

          BR="sync/$NEW"
          # Any prior PR for this tag (open, merged, or closed/rejected)
          # means we've already decided what to do with it - don't re-open.
          if [ "$(gh pr list --head "$BR" --state all --json number --jq length)" != "0" ]; then
            echo "outcome=skipped" >> "$GITHUB_OUTPUT"
            echo "detail=PR for $NEW already exists (open, merged, or rejected)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ok=true
          if [ "$MODE" = "rebase" ]; then
            git rev-list --reverse --no-merges HEAD --not "$CUR" "$NEW" > /tmp/carry.txt
            git checkout -B "$BR" "$NEW"
            while read -r c; do
              if ! git cherry-pick -x --empty=drop "$c" >/dev/null 2>&1; then
                files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
                git cherry-pick --abort || true
                ok=false; break
              fi
            done < /tmp/carry.txt
          else
            git checkout -B "$BR"
            if ! git merge --no-ff --no-edit "$NEW"; then
              files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
              git merge --abort || true
              ok=false
            fi
          fi

          if [ "$ok" = true ]; then
            echo "$NEW" > "$BASE_MARKER"
            git add "$BASE_MARKER"
            git commit -m "ktn: track $NEW"
            if [ "$DRY_RUN" = "true" ]; then
              echo "outcome=dry-clean" >> "$GITHUB_OUTPUT"
              echo "detail=clean (dry run, not pushed)" >> "$GITHUB_OUTPUT"
            else
              git push -f origin "$BR"
              body="Automated $MODE of carried patches onto $NEW. Build gate runs on this PR. Merging deploys."
              if [ "$HAS_PR_TOKEN" != "true" ]; then
                warn="⚠️ No SYNC_PR_TOKEN configured — if this branch touches .github/workflows/*.yml, checks will not auto-run. Close and reopen this PR to trigger them."
                body=$(printf '%s\n\n%s' "$body" "$warn")
              fi
              url=$(gh pr create --base "$DEPLOY_BRANCH" --head "$BR" --title "ktn: sync $NEW" --body "$body")
              echo "outcome=clean" >> "$GITHUB_OUTPUT"
              if [ "$HAS_PR_TOKEN" = "true" ]; then
                echo "detail=$url" >> "$GITHUB_OUTPUT"
              else
                echo "detail=$url (checks will not auto-run — close/reopen the PR to trigger them)" >> "$GITHUB_OUTPUT"
              fi
            fi
          else
            echo "outcome=conflict" >> "$GITHUB_OUTPUT"
            echo "detail=conflicts in: $files" >> "$GITHUB_OUTPUT"
          fi

  notify:
    needs: [detect, attempt]
    if: ${{ !cancelled() && needs.detect.outputs.has_new == 'true' }}
    runs-on: [self-hosted, ktn]
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.detect.outputs.new_tag }}
          MODE: ${{ inputs.mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          OUTCOME: ${{ inputs.mode == 'notify' && 'release' || (needs.attempt.outputs.outcome || 'failed') }}
          DETAIL: ${{ needs.attempt.outputs.detail || format('https://github.com/{0}/releases', inputs.upstream) }}
        run: |
          case "$OUTCOME" in
            clean)     title="$REPO: $TAG clean";             prio=default; tags=white_check_mark ;;
            dry-clean) title="$REPO: $TAG clean (dry run)";   prio=low;     tags=test_tube ;;
            conflict)  title="$REPO: $TAG conflicts";         prio=high;    tags=warning ;;
            skipped)   title="$REPO: $TAG PR already exists"; prio=low;     tags=fast_forward ;;
            release)   title="$REPO upstream: $TAG released"; prio=default; tags=package ;;
            failed)    title="$REPO: $TAG sync failed";       prio=high;    tags=rotating_light; DETAIL="sync job crashed — check the run" ;;
            *)         title="$REPO: $TAG sync failed";       prio=high;    tags=rotating_light; DETAIL="sync job crashed — check the run" ;;
          esac
          # A notify-mode dry run would otherwise send an indistinguishable
          # real-looking "released" ping.
          if [ "$MODE" = "notify" ] && [ "$DRY_RUN" = "true" ] && [ "$OUTCOME" = "release" ]; then
            title="[dry-run] $title"
          fi
          curl -sf -H "Title: $title" -H "Priority: $prio" -H "Tags: $tags" --data-raw "$DETAIL" "$NTFY_URL"

  record:
    needs: [detect, notify]
    if: inputs.mode == 'notify' && needs.notify.result == 'success' && needs.detect.outputs.has_new == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.new_tag }}
        run: |
          set -e
          R="$GITHUB_REPOSITORY"
          MSG="fork-sync: track $TAG"
          if gh api "repos/$R/git/ref/heads/fork-sync-state" >/dev/null 2>&1; then
            # The branch may already exist (e.g. token_check created it for
            # HEARTBEAT) without LAST_TAG on it yet - that 404 is normal,
            # not a script-ending failure; only trust the sha on success.
            file_sha=""
            if raw_sha=$(gh api "repos/$R/contents/LAST_TAG?ref=fork-sync-state" --jq .sha 2>/dev/null); then
              file_sha="$raw_sha"
            fi
            content_b64=$(printf '%s' "$TAG" | base64 -w0)
            if [ -n "$file_sha" ]; then
              gh api -X PUT "repos/$R/contents/LAST_TAG" \
                -f message="$MSG" -f content="$content_b64" -f branch=fork-sync-state -f sha="$file_sha" >/dev/null
            else
              gh api -X PUT "repos/$R/contents/LAST_TAG" \
                -f message="$MSG" -f content="$content_b64" -f branch=fork-sync-state >/dev/null
            fi
          else
            blob_sha=$(gh api -X POST "repos/$R/git/blobs" -f content="$TAG" -f encoding=utf-8 --jq .sha)
            tree_sha=$(jq -n --arg sha "$blob_sha" \
              '{tree: [{path: "LAST_TAG", mode: "100644", type: "blob", sha: $sha}]}' \
              | gh api -X POST "repos/$R/git/trees" --input - --jq .sha)
            commit_sha=$(jq -n --arg msg "$MSG" --arg tree "$tree_sha" \
              '{message: $msg, tree: $tree, parents: []}' \
              | gh api -X POST "repos/$R/git/commits" --input - --jq .sha)
            gh api -X POST "repos/$R/git/refs" -f ref='refs/heads/fork-sync-state' -f sha="$commit_sha" >/dev/null
          fi

  report_failure:
    needs: [detect, attempt, notify, record]
    if: ${{ failure() }}
    runs-on: [self-hosted, ktn]
    permissions: {}
    timeout-minutes: 5
    steps:
      - env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sf -H "Title: $REPO: fork-sync FAILED" -H "Priority: high" -H "Tags: rotating_light" --data-raw "A fork-sync job failed. $RUN_URL" "$NTFY_URL"

  # Runs on every invocation regardless of has_new/mode/success elsewhere:
  # (1) warns before SYNC_PR_TOKEN expires, since a quiet stretch with no
  #     new upstream release must not hide an expiring token; (2) refreshes
  #     repo activity on fork-sync-state so GitHub doesn't auto-disable the
  #     caller's scheduled workflow after 60 days of inactivity; (3) decides
  #     whether a monthly "still alive" ping is due. Writes ONLY to the
  #     orphan fork-sync-state branch, never to a deploy branch.
  token_check:
    needs: [detect, record]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      messages: ${{ steps.tc.outputs.messages }}
    steps:
      - id: tc
        env:
          # github.token always has contents:write on THIS repo (our own
          # job permissions grant it) - used for every fork-sync-state
          # read/write. SYNC_PR_TOKEN is deliberately scoped to the calling
          # fork repos, not to fork-sync itself, so it's used ONLY for the
          # one call that checks its own identity/expiry, never for writes
          # against this repo.
          GH_TOKEN: ${{ github.token }}
          CHECK_TOKEN: ${{ secrets.SYNC_PR_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
          LAST_SEEN: ${{ needs.detect.outputs.new_tag }}
        run: |
          set -eo pipefail
          R="$GITHUB_REPOSITORY"
          msgs='[]'

          add_msg() { # $1=title $2=priority $3=tags $4=body
            msgs=$(jq -c --arg t "$1" --arg p "$2" --arg g "$3" --arg b "$4" \
              '. + [{title:$t, prio:$p, tags:$g, body:$b}]' <<<"$msgs")
          }

          state_exists=false
          if gh api "repos/$R/git/ref/heads/fork-sync-state" >/dev/null 2>&1; then
            state_exists=true
          fi

          get_state_file() { # $1=path
            # Same rule as detect: check gh's own exit status before ever
            # piping a possible JSON error body into base64. Always return
            # 0 (not-found is a normal outcome here, never a script-ending
            # failure under set -e).
            local body
            if body=$(gh api "repos/$R/contents/$1?ref=fork-sync-state" 2>/dev/null); then
              printf '%s' "$body" | jq -r .content | base64 -d
            fi
            return 0
          }

          put_state_file() { # $1=path $2=content $3=commit message
            local b64 sha raw
            b64=$(printf '%s' "$2" | base64 -w0)
            if [ "$state_exists" = true ]; then
              sha=""
              if raw=$(gh api "repos/$R/contents/$1?ref=fork-sync-state" --jq .sha 2>/dev/null); then
                sha="$raw"
              fi
              if [ -n "$sha" ]; then
                gh api -X PUT "repos/$R/contents/$1" -f message="$3" -f content="$b64" -f branch=fork-sync-state -f sha="$sha" >/dev/null
              else
                gh api -X PUT "repos/$R/contents/$1" -f message="$3" -f content="$b64" -f branch=fork-sync-state >/dev/null
              fi
            else
              local blob_sha tree_sha commit_sha
              blob_sha=$(gh api -X POST "repos/$R/git/blobs" -f content="$2" -f encoding=utf-8 --jq .sha)
              tree_sha=$(jq -n --arg sha "$blob_sha" --arg path "$1" \
                '{tree: [{path: $path, mode: "100644", type: "blob", sha: $sha}]}' \
                | gh api -X POST "repos/$R/git/trees" --input - --jq .sha)
              commit_sha=$(jq -n --arg msg "$3" --arg tree "$tree_sha" \
                '{message: $msg, tree: $tree, parents: []}' \
                | gh api -X POST "repos/$R/git/commits" --input - --jq .sha)
              gh api -X POST "repos/$R/git/refs" -f ref='refs/heads/fork-sync-state' -f sha="$commit_sha" >/dev/null
              state_exists=true
            fi
          }

          # --- token expiry check ---
          days=""
          if ! resp=$(GH_TOKEN="$CHECK_TOKEN" gh api -i user 2>&1); then
            add_msg "$REPO: SYNC_PR_TOKEN check failed" high rotating_light \
              "Could not authenticate to check token expiry: $(printf '%s' "$resp" | tail -3 | tr '\n' ' ')"
          else
            exp_val=$(printf '%s\n' "$resp" | tr -d '\r' | grep -i '^github-authentication-token-expiration:' | head -1 | cut -d: -f2- | sed 's/^ *//; s/ *$//')
            if [ -z "$exp_val" ]; then
              already_warned=$(get_state_file NO_EXPIRY_WARNED)
              if [ -z "$already_warned" ]; then
                add_msg "$REPO: token expiry can't be monitored" default hourglass \
                  "SYNC_PR_TOKEN (or the default token) returned no expiration header - likely a classic or no-expiry token. fork-sync can't warn you before it dies. This is a one-time notice."
                put_state_file NO_EXPIRY_WARNED "1" "fork-sync: note unmonitorable token expiry"
              fi
            else
              exp_epoch=$(date -u -d "$exp_val" +%s)
              now_epoch=$(date -u +%s)
              days=$(( (exp_epoch - now_epoch) / 86400 ))
              if [ "$days" -le 7 ]; then
                add_msg "$REPO: SYNC_PR_TOKEN expires in $days days" high rotating_light "Token expires $exp_val. Rotate it soon."
              elif [ "$days" -le 30 ]; then
                add_msg "$REPO: SYNC_PR_TOKEN expires in $days days" default hourglass "Token expires $exp_val."
              fi
            fi
          fi

          # --- keepalive: any commit here refreshes repo activity, preventing
          # GitHub's 60-day auto-disable of the caller's scheduled workflow ---
          put_state_file HEARTBEAT "$(date -u +%FT%TZ)" "fork-sync: keepalive"

          # --- monthly dead-man's-switch ping: only on the first scheduled
          # run of the month, never on manual/testing dispatches ---
          if [ "$IS_SCHEDULE" = "true" ] && [ "$(date -u +%d)" -le 7 ]; then
            days_left="unmonitored"
            [ -n "$days" ] && days_left="$days days"
            add_msg "$REPO: fork-sync alive" low green_heart \
              "Last-seen upstream tag: ${LAST_SEEN:-unknown}. SYNC_PR_TOKEN expiry: $days_left."
          fi

          echo "messages=$msgs" >> "$GITHUB_OUTPUT"

  token_notify:
    needs: token_check
    if: ${{ !cancelled() && needs.token_check.outputs.messages != '' && needs.token_check.outputs.messages != '[]' }}
    runs-on: [self-hosted, ktn]
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          MESSAGES: ${{ needs.token_check.outputs.messages }}
        run: |
          echo "$MESSAGES" | jq -c '.[]' | while IFS= read -r m; do
            title=$(jq -r '.title' <<<"$m")
            prio=$(jq -r '.prio' <<<"$m")
            tags=$(jq -r '.tags' <<<"$m")
            body=$(jq -r '.body' <<<"$m")
            curl -sf -H "Title: $title" -H "Priority: $prio" -H "Tags: $tags" --data-raw "$body" "$NTFY_URL"
          done
