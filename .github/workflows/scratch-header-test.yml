name: scratch-header-test
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.SYNC_PR_TOKEN || github.token }}
        run: |
          echo "=== has SYNC_PR_TOKEN: $([ -n "${{ secrets.SYNC_PR_TOKEN }}" ] && echo yes || echo no) ==="
          gh api -i user 2>&1 | tr -d '\r' | grep -iE '^(github-authentication-token-expiration|x-oauth-scopes|status|http):' || true
          echo "=== full header dump ==="
          gh api -i user 2>&1 | tr -d '\r' | sed -n '1,30p'
